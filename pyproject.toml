# Dependencies + tool config ONLY. There is deliberately no [build-system]:
# botcore is vendored into each bot as `<bot>/botcore/` (a plain directory now, a
# git submodule later) and imported relatively, not pip-installed.
[project]
name = "botcore"
version = "0.1.0"
description = "Shared foundation for the TDT Discord bots (TDTbot, wit_bot)"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4",
    "gitpython",
    "humanize",
    "pytz",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# the parent of this directory must be importable so `import botcore` works
pythonpath = [".."]

[tool.ruff]
# Explicit on purpose: don't let the rule set shift with ruff's own defaults.
target-version = "py311"  # keep in step with requires-python
line-length = 120

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E4", "E7", "E9",  # pycodestyle: imports, statements, syntax/runtime errors
    "E501",   # line too long (limit: line-length = 120)
    "W6",     # pycodestyle: deprecated features
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async
    "BLE",    # flake8-blind-except
    "S102", "S110",  # exec, try/except/pass
    "LOG",    # flake8-logging
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "TC",     # flake8-type-checking
    "FURB",   # refurb
    "PL",     # pylint
    "TRY",    # tryceratops
    "RUF",    # ruff-specific
]
ignore = [
    "PT011", "PT018",  # pytest style nitpicks (broad raises, composite asserts)
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",  # complexity limits, magic values
    "PLC0415",  # lazy imports are deliberate
    "TRY003", "TRY300", "TRY400",  # exception-message/else/logging style
    "SIM105", "SIM108",  # opinionated rewrites
]

[tool.ruff.lint.per-file-ignores]
# the debugging cog exists to exec arbitrary code for admins
"cogs/debugging.py" = ["S102"]
# unpacking fixtures/tuples where only some members are used is idiomatic in tests
"tests/**" = ["RUF059"]
# carried over from .ruff.toml (replaced the old .flake8)
"cogs/wilds.py" = ["E501"]
"cogs/wit.py" = ["E501"]
"wit_data/__init__.py" = ["E501", "F401"]
"__init__.py" = ["F401"]
"*/__init__.py" = ["F401"]

[tool.uv]
# supply-chain hygiene, same policy as TDTbot's pyproject
exclude-newer = "14 days"
